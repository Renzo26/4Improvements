services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: production
      APP_PORT: "8080"
      SLA_MINUTES: ${SLA_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS}
    restart: unless-stopped
    networks:
      easypanel:
        aliases:
          - cloudy_4improvements_backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  easypanel:
    external: true
